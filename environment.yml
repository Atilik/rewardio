name: rewardio
channels:
  - conda-forge
  - defaults
dependencies:
  # ── Interpreter + build/system stack (conda) ──
  - python=3.11
  - numpy=2.4           # pre-installed for the madmom source build; proven with essentia-tensorflow on py3.11
  - cython              # required to build madmom from source
  - ffmpeg              # mp3/m4a decoding
  - libsndfile
  - ipykernel
  - pip
  # ── Python packages (pip, pinned) ──
  - pip:
      - torch==2.8.0
      - torchaudio==2.8.0
      - scipy>=1.13,<2
      - matplotlib>=3.9,<4
      - librosa==0.11.0
      - soundfile==0.14.0
      - sounddevice==0.5.5
      - pyloudnorm==0.2.0
      - mir_eval==0.8.2
      - demucs==4.0.1
      - essentia-tensorflow==2.1b6.dev1389
      - pytest==8.4.2
      # madmom: PyPI release is stale — install from GitHub, pinned to a commit
      - madmom @ git+https://github.com/CPJKU/madmom@27f032e8947204902c675e5e341a3faf5dc86dae
      # BEAT THIS! beat tracker (ISMIR 2024) — not on PyPI, pinned to release tag
      - beat_this @ git+https://github.com/CPJKU/beat_this@v1.1.0
